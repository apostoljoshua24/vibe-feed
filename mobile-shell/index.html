<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0a0b" />
    <title>SacShawty</title>
    <link rel="icon" href="icon.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="splash" class="splash">
      <img src="icon.png" alt="SacShawty" class="splash-logo" />
      <p class="splash-text">Loading feed</p>
      <p class="splash-hint"></p>
    </div>

    <header class="topbar">
      <span class="brand"><img src="icon.png" alt="" />SacShawty</span>
    </header>

    <main id="feed" class="feed"></main>

    <template id="card-tpl">
      <section class="card">
        <div class="stage">
          <video loop playsinline muted preload="metadata"></video>
          <div class="spinner"></div>
          <div class="failed hidden">
            <p>Unable to load video</p>
            <button class="retry">Retry</button>
          </div>
          <div class="shade"></div>
          <div class="actions">
            <button class="act like" aria-label="Like">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l8.8 8.8 8.8-8.8a5.5 5.5 0 0 0 0-7.8z"/></svg>
              <span class="count">0</span>
            </button>
            <button class="act comment" aria-label="Comments">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.9 8.9 0 0 1-4-.9L3 21l1.9-5a8.4 8.4 0 0 1 3.6-11.4 8.9 8.9 0 0 1 4-.9 8.4 8.4 0 0 1 8.5 7.8z"/></svg>
              <span class="count">0</span>
            </button>
            <button class="act share" aria-label="Share">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
            </button>
            <button class="act mute" aria-label="Mute">
              <svg class="ico-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m23 9-6 6M17 9l6 6"/></svg>
              <svg class="ico-loud hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
            </button>
          </div>
          <div class="meta">
            <p class="user"></p>
            <p class="nick"></p>
            <p class="desc"></p>
            <button class="more hidden" type="button">See more</button>
          </div>
          <div class="bar"><div class="bar-fill"></div></div>
        </div>
      </section>
    </template>

    <script src="app.js"></script>
  </body>
</html>
